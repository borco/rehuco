[project]
name = "rehuco-node"
dynamic = ["version"]
description = "rehuco local node: a heartbeat process the rehuco-agent runs beside itself"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ioan Calin", email = "iborco@gmail.com" },
]
keywords = ["rehuco", "resource-management", "rehu", "node"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: System Administrators",
    "Environment :: No Input/Output (Daemon)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.14"
# only what the heartbeat process imports; the web stack (FastAPI, uvicorn, zeroconf) joins this list the day
# the first endpoint is written, not before
dependencies = [
    "rehuco-core",
    "borco-core",
]

[project.scripts]
rehuco-node = "rehuco_node.__main__:main"

[project.urls]
Homepage = "https://borco.github.io/rehuco/"
Repository = "https://github.com/borco/rehuco/tree/master/packages/rehuco-node"
Issues = "https://github.com/borco/rehuco/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/rehuco_node/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rehuco_node"]

[tool.uv.sources]
rehuco-core = { workspace = true }
borco-core = { workspace = true }
