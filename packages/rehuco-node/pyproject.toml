[project]
name = "rehuco-node"
dynamic = ["version"]
description = "Reserved name for a future rehuco headless node — no service implemented yet"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ioan Calin", email = "iborco@gmail.com" },
]
keywords = ["rehuco", "resource-management", "rehu", "placeholder"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: System Administrators",
    "Environment :: No Input/Output (Daemon)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.14"
# nothing here until something imports it: the service's intended stack (FastAPI, uvicorn,
# zeroconf, cryptography) belongs in this list the day the first endpoint is written, not while
# the package is a name and a version constant -- an install that pulls a web server and an mDNS
# stack for five lines of docstring advertises a service that does not exist
dependencies = [
    "rehuco-core",
]

[project.urls]
Homepage = "https://borco.github.io/rehuco/"
Repository = "https://github.com/borco/rehuco/tree/master/packages/rehuco-node"
Issues = "https://github.com/borco/rehuco/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/rehuco_node/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rehuco_node"]

[tool.uv.sources]
rehuco-core = { workspace = true }
