[project]
name = "rehuco-agent"
dynamic = ["version"]
description = "rehuco PySide6 desktop GUI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ioan Calin", email = "iborco@gmail.com" },
]
keywords = ["rehuco", "resource-management", "rehu", "pyside6", "qt", "desktop", "gui"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Desktop Environment",
]
requires-python = ">=3.14"
dependencies = [
    "rehuco-core",
    "borco-core",
    "borco-pyside",
    # Essentials, not the `PySide6` meta-package -- see the note in borco-pyside's pyproject.toml.
    "PySide6-Essentials>=6.9",
    "pyside6-qtads>=5.0.0",
    "cbor2>=6.1.3",
    "python-dateutil>=2.9.0",
    "humanize>=4.16.0",
    "unidecode>=1.4.0",
    "pathvalidate>=3.3.1",
    # >=5.6.3.7 is the floor that keeps Addons out: earlier releases require the `PySide6`
    # meta-package, so an older resolve would drag Addons back in through this one dependency.
    "pyside6-scintilla>=5.6.3.7",
    "markdown>=3.7",
    "mistletoe>=1.4.0",
    "pillow",
]

[project.urls]
Homepage = "https://borco.github.io/rehuco/"
Repository = "https://github.com/borco/rehuco/tree/master/packages/rehuco-agent"
Issues = "https://github.com/borco/rehuco/issues"

[project.scripts]
rehuco-agent = "rehuco_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/rehuco_agent/__init__.py"

# hatchling's default file selection follows VCS tracking, so the gitignored *_ui.py/*_rc.py
# pyside6-uic/-rcc generate (`make uis`) are silently dropped from both the sdist and the wheel --
# confirmed with `uv build --package rehuco-agent` producing a wheel with no *_ui.py/*_rc.py at all,
# which ImportErrors on main_rc the first time anything reads a Qt resource. Briefcase never hit this
# (it copies src/rehuco_agent verbatim, no wheel build) and neither did a plain `uv sync` (editable
# install, no file-selection step) -- python-appimage's real `pip install <path>` is what surfaced it
# ([[packaging-deployment#linux-format]]). `artifacts` force-includes matching gitignored files.
[tool.hatch.build]
artifacts = [
    "*_ui.py",
    "*_rc.py",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rehuco_agent"]

# Briefcase: the end-user Windows/macOS artifacts -- installer, native app identity, and the .rehu
# document type, all declared here rather than in a hand-maintained per-OS manifest
# ([[packaging-deployment#app-identity]]; how-to and per-OS hurdles in
# [[appendices.briefcase-packaging#overview]]). Linux ships no Briefcase artifact at all
# ([[packaging-deployment#linux-format]]) -- `uv tool install` plus an AppImage, both registering
# themselves. Run it via `make agent-dist-build` / `make agent-dist-package`, never a bare `briefcase`
# (it reads the pyproject in the *current* directory, so it must run from this package).
#
# Briefcase 0.4.4 merges [project] into this table -- version (resolved through hatchling even though
# it is `dynamic`), description, license, license-files, url, author, author_email, requires-python,
# and dependencies (cumulative into `requires`). So none of those are repeated below; only what
# Briefcase has no PEP 621 equivalent for is.
[tool.briefcase]
project_name = "Rehuco"
# Reverse-DNS namespace of the domain the project publishes from (borco.github.io). Combined with
# the app name it forms the macOS bundle identifier and UTI, and the Windows MSI's ProgID and
# upgrade GUID -- all of which orphan their registrations if it ever changes, so it is fixed.
bundle = "io.github.borco"

[tool.briefcase.app.rehuco-agent]
# The user-visible name: Rehuco.exe / Rehuco.app, the Start-menu entry, the install folder, and the
# label in Explorer's "Open with" list -- matching the shell verb's own "Open with Rehuco" (#43).
# The table key stays `rehuco-agent`, so the packaged module is `rehuco_agent` as everywhere else.
formal_name = "Rehuco"
# Basename only: Briefcase appends the extension each platform's template asks for, so this one
# entry resolves to design/icons/rehuco-agent.ico on Windows and .icns on macOS (both generated by
# `make icons` from the single PNG master, [[packaging-deployment#design-resources]]).
icon = "../../design/icons/rehuco-agent"
sources = ["src/rehuco_agent"]
# Briefcase pip-installs `requires` into the bundle and cannot see the uv workspace, so the three
# workspace packages -- which arrive from [project].dependencies as bare names -- need a direct
# reference each. pip resolves a name that has a direct reference to that reference, so the bare
# names never reach PyPI (where `borco-*` do not exist and `rehuco-core` is a 0.0.0 stub).
# Relative to this file; Briefcase absolutizes any entry starting with ./ or ../.
requires = [
    "../rehuco-core",
    "../borco-core",
    "../borco-pyside",
]

[tool.briefcase.app.rehuco-agent.macOS]
# Briefcase's macOS stdout/stderr -> unified-log shim; the version tracks the app template, not an
# older pin ([[appendices.briefcase-packaging#hurdles]]).
requires = ["std-nslog~=2.0.0"]
# PySide6's macOS wheel is tagged macosx_13_0_universal2. Briefcase asks pip for a wheel compatible
# with the bundle's minimum macOS, and its own default of 11.0 matches none -- the build then fails
# with a bare "No matching distribution found for PySide6" ([[appendices.briefcase-packaging#hurdles]]).
min_os_version = "13.0"
# Apple-silicon only, forced by a dependency rather than chosen. Briefcase's default universal2 build
# installs the dependency set twice -- once per arch, pinned to the same versions so the two halves
# match -- and `cbor2` publishes no x86_64 macOS wheel at 6.x (that platform stops at 5.9.0), so the
# x86_64 pass fails with "No matching distribution found for cbor2==6.1.3". The alternative would be
# pinning the app down to cbor2 5.x to suit the packager, which is the wrong way round
# ([[appendices.briefcase-packaging#hurdles]]).
universal_build = false

# Declared under macOS, *not* at app level, so Windows resolves `document_type = None`. On macOS this
# is the only way to claim the extension -- a bundle's UTI and CFBundleDocumentTypes, with no
# `--register` equivalent. On Windows it would add a second ProgID
# (io.github.borco.rehuco-agent.rehu) covering .rehu alone, competing with the Rehuco.Document the
# app registers for itself; the app's Registry page could never recognise it, and an MSI uninstall
# would strip one of the two ([[appendices.briefcase-packaging#windows]]). There, post_install.bat
# calls the app's own --register instead, which covers .tc and the shell verbs as well.
[tool.briefcase.app.rehuco-agent.macOS.document_type.rehu]
description = "Rehuco Resource"
extension = "rehu"
# No dedicated document icon in the design master yet, so the app's own icon stands in.
icon = "../../design/icons/rehuco-agent"
url = "https://borco.github.io/rehuco/"
# Also what the Linux MIME package registers (#209); Briefcase's own default would have been
# application/x-rehuco-agent-rehu, which names the app rather than the format.
mime_type = "application/x-rehuco"

[tool.briefcase.app.rehuco-agent.windows]
# Per-user install: no UAC prompt, and it matches the HKCU-only registration the app writes for
# itself ([[packaging-deployment#app-identity]]). Left unset, the MSI asks the user which scope.
system_installer = false
# The MSI delegates file association to the app rather than declaring it: post_install.bat calls
# `Rehuco.exe --register`, pre_uninstall.bat calls `--unregister` before the files go. That gives one
# registration identity instead of two, covers .tc and the folder/archive verbs the MSI has no way to
# declare, and makes the app's Registry settings page (#47) report the truth after an install
# ([[appendices.briefcase-packaging#windows]]). Paths are relative to this file.
# Without these two, the MSI wears the WiX Toolset's own red bitmaps. Basenames: Briefcase appends
# `.bmp`, the only format WiX reads. Generated by `make icons` from the same PNG master as the icons
# ([[packaging-deployment#design-resources]]), so they are gitignored like the .ico and .icns.
installer_background = "installer/background"
installer_banner = "installer/banner"
post_install_script = "installer/post_install.bat"
pre_uninstall_script = "installer/pre_uninstall.bat"

[tool.uv.sources]
rehuco-core = { workspace = true }
borco-core = { workspace = true }
borco-pyside = { workspace = true }
