[project]
name = "borco-pyside"
dynamic = ["version"]
description = "Generic reusable PySide6/Qt classes and utilities"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ioan Calin", email = "iborco@gmail.com" },
]
keywords = ["borco", "pyside6", "qt", "gui", "library", "utilities"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.14"
dependencies = [
    # Essentials, not the `PySide6` meta-package: that one exists only to require Essentials *and*
    # Addons, so naming it pulls ~440-490 MB of QtWebEngine/Qt3D/QuickThreeD nothing here imports
    # ([[packaging-deployment#channels]]). Essentials ships the same `PySide6` package directory.
    "PySide6-Essentials>=6.9",
    "colorama>=0.4.6",
    # !=5.0.0.1: that release's version-bump commit silently reverted its vendored Qt-ADS submodule
    # from 5.0.0 back to a 4.5.0-era commit, so the wheel ships 4.5 C++ under a 5.0.0.1 version
    # (verified: `ColorSchemeMode`, `DisableStylesheet` and `isApplicationPaletteDark` are all absent
    # from its binary, present in 5.0.0's). `QtAdsFocusTracker` reads the first and third at
    # construction, so it would AttributeError at startup in every window. `!=` rather than a `==`
    # pin, so a fixed 5.0.0.2 is picked up normally.
    "pyside6-qtads>=5.0.0,!=5.0.0.1",
]

[project.urls]
Homepage = "https://borco.github.io/rehuco/"
Repository = "https://github.com/borco/rehuco/tree/master/packages/borco-pyside"
Issues = "https://github.com/borco/rehuco/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/borco_pyside/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/borco_pyside"]

[dependency-groups]
dev = [
    "types-colorama>=0.4.15.20260408",
]
