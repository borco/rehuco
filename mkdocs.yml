site_name: rehuco
site_dir: .site
site_description: Distributed resource management system for tutorials and reference images
site_url: https://borco.github.io/rehuco/
repo_url: https://github.com/borco/rehuco
repo_name: borco/rehuco
edit_uri: edit/master/docs/

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/diagram-open.js

hooks:
  - tools/mkdocs_slug_ref_hook.py
  - tools/mkdocs_relative_link_hook.py

plugins:
  - search
  - plantuml:
      puml_url: !ENV [PUML_URL, "https://www.plantuml.com/plantuml"]
      puml_keyword: plantuml
      interaction:
        enabled: false

theme:
  name: material
  favicon: assets/images/favicon.svg
  logo: assets/images/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

markdown_extensions:
  - admonition
  - github-callouts
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  # Lets the site include the per-package CHANGELOG.md files and the LICENSE verbatim instead of keeping
  # a second copy under docs/ that would drift. base_path is the repo root, so paths are as written there.
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.magiclink:
      repo_url_shorthand: true
      provider: github
      user: borco
      repo: rehuco

nav:
  - Home: index.md
  - Design Specs:
      - How It Works: specs/how-it-works.md
      - Document Map: specs/README.md
      - Overview: specs/architecture-design.md
      - Data Model: specs/data-model.md
      - Node Communication: specs/nodes.md
      - Discovery & Trust: specs/discovery-trust-access.md
      - Sync & Conflicts: specs/sync.md
      - Multiplicity: specs/multiplicity.md
      - Mounts & Storage: specs/mounts-and-storage.md
      - Identity & Dedup: specs/instances-and-dedup.md
      - Borrowing: specs/borrowing.md
      - Offline Editing: specs/offline-editing.md
      - Plugins: specs/plugins.md
      - Requirements: specs/requirements.md
      - Acquisition Tooling: specs/acquisition-tooling.md
      - Packaging & Deployment: specs/packaging-deployment.md
      - Field Schema: specs/field-schema.md
      - Diagrams:
          - Overview: specs/diagrams/README.md
          - "Activity: Open a Path": specs/diagrams/activity-open-document.md
          - "Component: Containment": specs/diagrams/component-decomposition.md
          - "Sequence: Open a Path": specs/diagrams/sequence-open-document.md
      - Appendices:
          - Briefcase Packaging: specs/appendices/briefcase-packaging.md
          - Code Conventions: specs/appendices/code-conventions.md
          - Continuous Integration: specs/appendices/continuous-integration.md
          - Open Questions: specs/appendices/open-questions.md
          - Post-Mortem: specs/appendices/post-mortem.md
          - Project Management: specs/appendices/project-management.md
          - QtAds: specs/appendices/qt-ads.md
          - Release Runbook: specs/appendices/release-runbook.md
          - Settings Pages: specs/appendices/settings-pages.md
          - Testing: specs/appendices/testing.md
          - Theming & Styling: specs/appendices/theming_and_styling.md
          - Windows Dev Launcher: specs/appendices/windows-dev-launcher.md
      - History:
          - Overview: specs/history/README.md
          - ibocator: specs/history/ibocator.md
          - TutCatalog: specs/history/tutcatalog.md
          - Tutcatalog 3: specs/history/tutcatalog3.md
          - TutCatalogPy: specs/history/tutcatalogpy.md
          - TutCatalogPy2: specs/history/tutcatalogpy2.md
          - TutCatalogPy3: specs/history/tutcatalogpy3.md
          - TutCatalog4: specs/history/tutcatalog4.md
          - TutCatalog5: specs/history/tutcatalog5.md
          - Resource Hub: specs/history/resource-hub.md
          - Daz3D Personal Database: specs/history/daz3d-personal-database.md
          - pyside-ibo (shared library): specs/history/pyside-ibo.md
  - Implementation Plan: specs/implementation-plan.md
  - Changelog:
      - Overview: changelog/index.md
      - rehuco-agent: changelog/rehuco-agent.md
      - rehuco-core: changelog/rehuco-core.md
      - rehuco-node: changelog/rehuco-node.md
      - borco-core: changelog/borco-core.md
      - borco-pyside: changelog/borco-pyside.md
  - License: license.md
