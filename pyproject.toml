[tool.uv.workspace]
members = [
    "packages/*",
]

[dependency-groups]
dev = [
    "bandit>=1.8",
    "markdown-callouts>=0.4",
    "mkdocs>=1.6",
    "mkdocs-exclude>=1.0",
    "mkdocs-material>=9.5",
    "mkdocs-puml>=2.3",
    "pyright>=1.1",
    "pylint>=3.3",
    "pylint-qt>=0.1",
    "pytest>=8.3",
    "pytest-benchmark>=5.1",
    "pytest-cov>=6.1",
    "pytest-explicit>=1.0",
    "pytest-freezer>=0.4",
    "pytest-mock>=3.14",
    "pytest-qt>=4.4",
    "ruff>=0.11",
    "types-markdown>=3.10.2.20260518",
    "types-python-dateutil>=2.9",
]

# Briefcase builds the shippable Windows/macOS artifacts (`make agent-dist-build`, `agent-dist-package`,
# [[packaging-deployment#app-identity]]). Deliberately *not* in `[tool.uv] default-groups`: it pulls
# ~30 packages (cookiecutter, GitPython, requests, rich) that only a release build needs. The cost is
# that `uv sync` is an exact sync of the *default* groups, so a plain `make sync` prunes briefcase
# again -- the Makefile targets pass `--group packaging`, which reinstalls it on demand.
packaging = [
    "briefcase>=0.4.4",
]

# python-appimage builds the Linux AppImage (`make agent-appimage-build`,
# [[packaging-deployment#linux-format]] point 5). Opt-in for the same reason as `packaging` above: it's
# release-time tooling, not something a plain `uv sync` should carry.
appimage = [
    "python-appimage>=1.4",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.bandit]
# "build"/"dist" are Briefcase's output under packages/rehuco-agent/ -- a whole vendored copy of the
# Qt stack, which bandit would otherwise scan and fail on (346 low findings in PyYAML alone). Plain
# substrings, not paths: bandit tests each with `x in path`, so a written-out path would only match
# on the OS whose separator it used. Nothing tracked under packages/ or tools/ contains either word.
exclude_dirs = ["tests", "build", "dist"]

[tool.pylint.main]
jobs = 0
recursive = true
extension-pkg-allow-list = ["PySide6", "shiboken6"]
load-plugins = ["pylint_qt"]
# generated by pyside6-uic/-rcc (make uis / make qrcs); gitignored, never hand-edited or hand-fixed
ignore-patterns = [".*_ui\\.py$", ".*_rc\\.py$"]
# Briefcase's bundle and installer output (`make agent-dist-build`/`agent-dist-package`): a vendored copy of
# every dependency, none of it ours to lint. Matched against each path segment, so no separator
# portability problem; `ignore-paths` would need a regex per OS separator instead.
ignore = ["build", "dist"]

[tool.pylint.format]
max-line-length = 120

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
# This is a cross-platform project with per-platform modules (Windows winreg/ctypes.windll,
# macOS/Linux paths). "All" makes platform-gated stdlib symbols resolvable regardless of which
# OS qa runs on, so e.g. platforms/windows/ type-checks on macOS/Linux instead of erroring.
pythonPlatform = "All"
# Briefcase's bundle and installer output (`make agent-dist-build`/`agent-dist-package`) is a vendored copy of
# every dependency; type-checking it is neither meaningful nor cheap.
# Setting this replaces pyright's defaults rather than adding to them, so they are restated.
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "**/build", "**/dist"]

[tool.pylint.similarities]
# duplicate-code compares across the whole run and reports against an arbitrary module, so it can
# never be suppressed where the similarity actually is -- which leaves the threshold as the only
# place to answer it. Both cases it finds are mirrors that exist on purpose: `TaskQueue.Entry` is
# the mutable original its frozen `JobStatus` snapshot is taken from, so the two agree field for
# field by design ([[appendices.task-queue#observation]]), and a subpackage's `__all__` necessarily
# repeats the names its parent re-exports. Eight clears both and still catches a copied function.
min-similarity-lines = 8

[tool.pylint.messages_control]
# redefined-outer-name: standard false positive for pytest fixtures used as same-file test parameters
disable = ["fixme", "redefined-outer-name"]
enable = ["useless-suppression"]

[tool.pylint.typecheck]
# winreg is Windows-only; on a macOS/Linux qa run pylint can't import it and would raise
# import-error. A per-line disable can't be used here -- useless-suppression (enabled above)
# would flag it on Windows, where the import resolves fine. Ignoring the module is platform-safe.
ignored-modules = ["winreg"]
# The mirror case: os.chown is POSIX-only, so a Windows run raises no-member on the guarded
# call in borco_core.atomic_write while a POSIX run resolves it fine -- a per-line disable is
# correct on exactly one platform and useless on the other. Declaring the member is what makes
# the same source pass on all three runners; the runtime hasattr guard is what makes it correct.
generated-members = ["os.chown"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
pythonpath = ["."]
testpaths = ["packages", "tools"]
markers = [
    "slow: marks tests that are slow to run",
    "disk: marks tests that perform real disk I/O (no mocks)",
    "windows: marks tests that only run on Windows",
    "macos: marks tests that only run on macOS",
    "linux: marks tests that only run on Linux",
    "fails_offscreen: marks tests that fail when run offscreen (e.g. in CI)",
    "checksum_benchmark: marks tests that benchmark checksum performance (not correctness)",
]
explicit-only = ["fails_offscreen", "checksum_benchmark"]

[tool.coverage.run]
branch = true
# coverage_platform (repo-root module, importable via pytest pythonpath above) drops rehuco's
# Windows-only code from the report on non-Windows -- runner-independent, so it applies to
# `make cov`, a bare `pytest --cov`, and the VSCode test runner alike. See coverage_platform.py.
plugins = ["coverage_platform"]
omit = [
    # generated by pyside6-uic/-rcc (make uis / make qrcs); gitignored, never hand-edited or hand-fixed
    "*_ui.py",
    "*_rc.py",
    # measure production code exercised by tests, not the tests' own lines
    "*/tests/*",
    "*conftest.py",
    # test/coverage infrastructure, not product code
    "*coverage_platform.py",
]

[tool.coverage.html]
directory = ".htmlcov"
