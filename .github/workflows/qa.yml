name: QA

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# Every check is its own job, so they all run at once and the run takes as long as the slowest one, not their sum
# ([[appendices.continuous-integration#parallel-jobs]]). The checks that read source as text -- ruff, the slug
# references, bandit -- run once; the tests, pyright and pylint run on each OS, since what they import differs by
# platform.

jobs:
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `flag` feeds Codecov's per-OS flag (#19) -- lowercase, matching Codecov's naming
        # convention; kept alongside `os` here instead of lowercasing `runner.os` at upload time.
        include:
          - os: ubuntu-latest
            flag: linux
          - os: macos-latest
            flag: macos
          - os: windows-latest
            flag: windows
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          qt: "true"

      - name: Run tests with coverage
        run: make cov-parallel

      # fail_ci_if_error: false -- this is new plumbing (#19); don't let upload flakiness
      # (rate limits, transient Codecov outages) fail QA. Tighten once it's proven reliable.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.flag }}
          fail_ci_if_error: false

  pyright:
    name: pyright (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          qt: "true"
      - run: make pyright

  pylint:
    name: pylint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          qt: "true"
      - run: make pylint

  # Non-mutating equivalent of `make format` -- [[appendices.continuous-integration#non-mutating-ci]].
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: |
          uv run ruff format --check .
          uv run ruff check .

  check-slugs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: make check-slugs

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: make bandit
